[project]
name = "deepnovel"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # LangGraph / LangChain（锁定版本）
    "langgraph==1.1.2",
    "langchain>=0.3",
    "langchain-openai>=0.3",
    "langchain-anthropic>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    # 数据库
    "aiosqlite>=0.20",
    "sqlalchemy>=2.0",
    # 文件处理
    "python-docx>=1.1",
    "pypdf>=4.0",
    "aiofiles>=23.0",
    "chardet>=5.0",
    # OCR
    "rapidocr-onnxruntime>=1.4",
    # 网页爬取
    "scrapling>=0.2",
    # 数据验证
    "pydantic>=2.0",
    # CLI
    "rich>=13.0",
    # 环境变量
    "python-dotenv>=1.0",
    # 工具
    "python-ulid>=2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "langchain-core>=1.2.18",
    "json-repair>=0.58.6",
    "msgpack>=1.1.2",
]

[project.scripts]
deepnovel = "__main__:main"
